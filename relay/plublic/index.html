<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0f"><title>Kairo Control — Acesso remoto</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><div class="brand"><div class="logo">K</div><div><b>KAIRO</b><span>REMOTE</span></div></div><span class="pill"><i></i> RELAY ONLINE</span></header><main><section class="hero"><p class="eyebrow">ACESSO DE QUALQUER LUGAR</p><h1>Conecte-se ao seu PC.</h1><p>Digite o código mostrado no Kairo instalado no seu computador.</p></section><section class="card connect"><label for="code">Código do PC</label><div class="codeRow"><input id="code" maxlength="10" inputmode="text" autocomplete="one-time-code" placeholder="A1B2C3D4E5"><button id="connect">Conectar</button></div><div id="status" class="status">Aguardando código…</div></section><section id="remote" class="hidden"><div class="topbar"><div><b id="deviceName">Meu PC</b><small id="cloudStatus">conectado</small></div><button id="disconnect" class="ghost">Desconectar</button></div><section class="viewer off" id="viewer"><div id="hint">Espelhamento desligado</div><img id="screen" alt="Tela do PC" draggable="false"><div id="cursor"></div><div class="live">● AO VIVO</div></section><div class="actions"><button id="mirror" class="primary">Ativar espelhamento</button><button id="full">⛶ Tela cheia</button><button id="rotate">↻ Paisagem</button></div><div class="grid"><button data-app="spotify">Spotify</button><button data-app="chrome">Chrome</button><button data-app="discord">Discord</button><button data-app="explorer">Explorador</button><button data-app="notepad">Bloco de notas</button><button data-app="calculator">Calculadora</button><button id="lock">🔒 Bloquear PC</button><button id="voice">🎙 Voz</button></div><div class="keys"><button data-key="ESC">Esc</button><button data-key="TAB">Tab</button><butto
